
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101019">
<title>KIMIMI — Your AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101019;color:#f4f3fb;font-family:system-ui,-apple-system,sans-serif}
.app{max-width:760px;height:100dvh;margin:auto;display:flex;flex-direction:column;padding:14px}
header{padding:15px 4px;border-bottom:1px solid #30303e}
h1{margin:0;font-size:27px;letter-spacing:2px}
.sub{color:#a6a4b9;font-size:13px;margin-top:4px}
#status{font-size:12px;color:#a6a4b9;margin-top:10px}
#chat{flex:1;overflow:auto;padding:18px 0;display:flex;flex-direction:column;gap:14px}
.msg{padding:13px 15px;border-radius:17px;max-width:90%;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}
.user{align-self:flex-end;background:#6557d9;color:white}
.assistant{align-self:flex-start;background:#222230;border:1px solid #353548}
form{display:flex;gap:8px;padding:12px 0 6px}
textarea{flex:1;resize:none;min-width:0;max-height:130px;border:1px solid #39394d;border-radius:15px;background:#1c1c29;color:white;padding:13px;font:inherit;outline:none}
button{border:0;border-radius:13px;padding:0 18px;background:#7969ed;color:white;font-weight:700;font-size:15px}
button:disabled{opacity:.5}
.note{text-align:center;font-size:11px;color:#9694aa;padding:8px 0}
</style>
</head>
<body>
<div class="app">
<header>
<h1>✦ KIMIMI</h1>
<div class="sub">Your personal AI assistant</div>
<div id="status">Connecting to KIMIMI…</div>
</header>
<main id="chat" aria-live="polite">
<div class="msg assistant">Hey! I'm KIMIMI. Send me a message to get started. ✨</div>
</main>
<form id="form">
<textarea id="input" rows="1" placeholder="Ask KIMIMI anything…" required></textarea>
<button id="send" type="submit">Send</button>
</form>
<div class="note">AI responses require an available free model. Avoid sending private information.</div>
</div>
<script>
const API="https://kimimi-api.khotsam248.workers.dev";
const chat=document.getElementById("chat");
const form=document.getElementById("form");
const input=document.getElementById("input");
const send=document.getElementById("send");
const status=document.getElementById("status");
let messages=[];

function bubble(text,role){
 const el=document.createElement("div");
 el.className="msg "+role;
 el.textContent=text;
 chat.appendChild(el);
 chat.scrollTop=chat.scrollHeight;
 return el;
}

fetch(API).then(r=>{
 if(!r.ok) throw Error();
 return r.json();
}).then(()=>{
 status.textContent="● API connected";
 status.style.color="#7ee0a2";
}).catch(()=>{
 status.textContent="API connection needs checking";
});

form.addEventListener("submit",async e=>{
 e.preventDefault();
 const text=input.value.trim();
 if(!text||send.disabled)return;
 bubble(text,"user");
 messages.push({role:"user",content:text});
 input.value="";
 send.disabled=true;
 send.textContent="…";
 const waiting=bubble("Thinking…","assistant");
 try{
  const r=await fetch(API,{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({messages})
  });
  const data=await r.json();
  if(!r.ok)throw Error(data.error||data.message||"Request failed ("+r.status+")");
  const answer=data.choices?.[0]?.message?.content;
  if(!answer)throw Error(data.error?.message||"No answer returned. The free model may be unavailable.");
  waiting.textContent=answer;
  messages.push({role:"assistant",content:answer});
 }catch(err){
  waiting.textContent="Sorry, I couldn't get an AI response.\n"+err.message+"\n\nCheck the Worker API key, free-model availability, and Cloudflare logs.";
  messages.pop();
 }finally{
  send.disabled=false;
  send.textContent="Send";
  input.focus();
 }
});
input.addEventListener("keydown",e=>{
 if(e.key==="Enter"&&!e.shiftKey){
  e.preventDefault();
  form.requestSubmit();
 }
});
</script>
</body>
</html>
